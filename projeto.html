<style>
  :root{
    --bg:#0D2648;
    --bg-panel:#0D2A4F;
    --bg-panel-2:#0D274B;
    --line: rgba(136,165,214,0.18);
    --line-strong: rgba(136,165,214,0.4);
    --ink:#FFFFFF;
    --ink-dim:#E3E5E8;
    --ink-dimmer:#88A5D6;
    --amber:#038FFD;
    --amber-soft:#88A5D6;
    --teal:#88A5D6;
    --deep:#0D2648;
    --deep-hover:#053A96;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0/48px 48px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/48px 48px,
      var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
  }
  ::selection{background:var(--amber); color:#0D2648;}
  a{color:inherit;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  .wrap{max-width:1120px; margin:0 auto; padding:0 28px;}
  h1,h2,h3{margin:0; font-weight:600; letter-spacing:-0.01em;}
  p{margin:0;}

  /* ---------- Nav ---------- */
  header{
    position:sticky; top:0; z-index:50;
    backdrop-filter:blur(10px);
    background:rgba(13,38,72,0.82);
    border-bottom:1px solid var(--line);
  }
  .navbar{display:flex; align-items:center; justify-content:space-between; height:68px;}
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:1.05rem; text-decoration:none;}
  .brand svg{display:block;}
  .brand-text{display:flex; flex-direction:column; line-height:1.1;}
  .brand-text small{font-family:'IBM Plex Mono',monospace; font-size:0.6rem; color:var(--ink-dimmer); letter-spacing:0.04em; font-weight:500;}
  nav.links{display:flex; gap:2px; align-items:center;}
  nav.links a{
    text-decoration:none; color:var(--ink-dim); font-size:0.88rem; padding:8px 14px;
    border-radius:var(--radius); transition:color .15s ease, background .15s ease;
  }
  nav.links a:hover{color:var(--amber); background:rgba(3,143,253,0.06);}
  .nav-cta{
    border:1px solid var(--deep) !important; background:var(--deep); color:#FFFFFF !important; margin-left:8px;
  }
  .nav-cta:hover{background:var(--deep-hover) !important; border-color:var(--deep-hover) !important;}
  .menu-btn{display:none; background:none; border:1px solid var(--line-strong); color:var(--amber); width:40px; height:40px; border-radius:var(--radius); cursor:pointer;}

  /* ---------- Hero ---------- */
  .hero{padding:96px 0 88px; position:relative; overflow:hidden;}
  .hero-grid{display:grid; grid-template-columns:1.15fr 0.85fr; gap:56px; align-items:center;}
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:0.78rem; color:var(--amber); display:flex; align-items:center; gap:10px; margin-bottom:22px;}
  .eyebrow .dot{width:6px; height:6px; background:var(--amber); border-radius:50%; box-shadow:0 0 0 4px rgba(3,143,253,0.15);}
  .hero h1{font-size:clamp(2.3rem, 4.4vw, 3.6rem); line-height:1.06; max-width:16ch;}
  .hero h1 .accent{color:var(--amber);}
  .hero-sub{margin-top:22px; color:var(--ink-dim); font-size:1.06rem; max-width:46ch;}
  .hero-actions{margin-top:34px; display:flex; gap:14px; flex-wrap:wrap;}
  .btn{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:0.92rem; text-decoration:none;
    padding:13px 24px; border-radius:var(--radius); display:inline-flex; align-items:center; gap:8px;
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .btn-primary{background:var(--deep); color:#FFFFFF; border:1px solid #038FFD;}
  .btn-primary:hover{background:var(--deep-hover); border-color:var(--deep-hover); transform:translateY(-1px);}
  .btn-ghost{border:1px solid var(--line-strong); color:var(--ink);}
  .btn-ghost:hover{border-color:var(--amber); color:var(--amber);}

  .schematic{position:relative; aspect-ratio:1/1; max-width:420px; margin:0 auto; cursor:crosshair; touch-action:none;}
  .schematic .hint{
    position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
    font-family:'IBM Plex Mono',monospace; font-size:0.66rem; color:var(--ink-dimmer);
    letter-spacing:0.03em; pointer-events:none; white-space:nowrap;
  }
  .readout{
    font-family:'IBM Plex Mono',monospace; font-size:0.66rem; color:var(--teal); fill:var(--teal);
  }

  /* boot console */
  .console{
    margin-top:30px; border:1px solid var(--line); background:rgba(8,32,104,0.6);
    border-radius:var(--radius); padding:16px 18px; max-width:44ch;
  }
  .console .line{
    font-family:'IBM Plex Mono',monospace; font-size:0.78rem; color:var(--teal);
    white-space:pre; min-height:1.3em; display:flex; align-items:center; gap:8px;
  }
  .console .line .ok{color:var(--amber);}
  .console .cursor{
    display:inline-block; width:7px; height:14px; background:var(--amber);
    animation:blink 1s step-end infinite; vertical-align:middle;
  }
  @keyframes blink{50%{opacity:0;}}

  /* status LED on cards */
  .status-led{
    position:absolute; top:20px; right:22px; display:flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono',monospace; font-size:0.62rem; color:var(--ink-dimmer); letter-spacing:0.04em;
  }
  .status-led .dot{
    width:6px; height:6px; border-radius:50%; background:#4ADE80;
    box-shadow:0 0 0 3px rgba(74,222,128,0.18);
    animation:pulse-led 2.2s ease-in-out infinite;
  }
  @keyframes pulse-led{0%,100%{opacity:1;}50%{opacity:0.35;}}

  .card .icon svg{transition:transform .5s ease;}
  .card:hover .icon svg{transform:rotate(24deg);}
  .card:hover{box-shadow:0 0 0 1px var(--line-strong), 0 12px 28px -14px rgba(3,143,253,0.35);}

  .brand img{transition:transform .4s ease;}
  .brand:hover img{transform:rotate(-8deg);}

  /* accordion */
  .acc-list{border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  .acc-item{background:var(--bg-panel); border-bottom:1px solid var(--line);}
  .acc-item:last-child{border-bottom:none;}
  .acc-item:nth-child(even){background:var(--bg-panel-2);}
  .acc-item summary{
    list-style:none; cursor:pointer; padding:22px 26px;
    display:grid; grid-template-columns:52px 1fr auto auto; gap:18px; align-items:center;
    -webkit-tap-highlight-color:transparent;
  }
  .acc-item summary::-webkit-details-marker{display:none;}
  .acc-item summary::marker{content:'';}
  .acc-item summary:hover h3{color:var(--amber);}
  .acc-icon{
    width:52px; height:52px; flex-shrink:0; border:1px solid var(--line); border-radius:var(--radius);
    background:var(--bg-panel-2); display:flex; align-items:center; justify-content:center; color:var(--amber);
    transition:transform .4s ease;
  }
  .acc-item[open] .acc-icon{transform:rotate(6deg);}
  .acc-item summary h3{font-size:1.02rem; transition:color .15s ease;}
  .acc-item summary .teaser{display:block; color:var(--ink-dim); font-size:0.85rem; font-weight:400; margin-top:4px;}
  .acc-status{
    display:flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:0.62rem;
    color:var(--ink-dimmer); letter-spacing:0.04em; white-space:nowrap;
  }
  .acc-status .dot{width:6px; height:6px; border-radius:50%; background:#4ADE80; box-shadow:0 0 0 3px rgba(74,222,128,0.18); animation:pulse-led 2.2s ease-in-out infinite;}
  .acc-chevron{color:var(--ink-dimmer); transition:transform .25s ease;}
  .acc-item[open] .acc-chevron{transform:rotate(180deg); color:var(--amber);}
  .acc-body{padding:0 26px 30px 98px; color:var(--ink-dim); font-size:0.92rem; max-width:76ch;}
  .acc-body p{margin-bottom:16px;}
  .acc-body ul{margin:0 0 18px; padding-left:18px; display:flex; flex-direction:column; gap:9px;}
  .acc-body li{font-size:0.87rem;}
  .acc-body li strong{color:var(--ink); font-weight:600;}
  .acc-body .chip-row{margin-top:2px;}

  @media (max-width: 640px){
    .acc-item summary{grid-template-columns:44px 1fr auto; row-gap:6px;}
    .acc-status{display:none;}
    .acc-body{padding-left:26px;}
  }

  /* ---------- Sections ---------- */
  section{padding:84px 0; border-top:1px solid var(--line);}
  .section-head{display:grid; grid-template-columns:auto 1fr; gap:24px; align-items:baseline; margin-bottom:44px;}
  .tag{font-family:'IBM Plex Mono',monospace; font-size:0.74rem; color:var(--amber-soft); white-space:nowrap; padding-top:6px;}
  .section-head h2{font-size:clamp(1.6rem,2.6vw,2.1rem);}
  .section-lead{color:var(--ink-dim); max-width:62ch; margin-top:10px; font-size:0.98rem;}

  /* about */
  .about-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:56px;}
  .about-grid p{color:var(--ink-dim); margin-bottom:16px;}
  .about-grid strong{color:var(--ink); font-weight:600;}
  .lead-card{
    border:1px solid var(--line); background:var(--bg-panel); padding:26px; border-radius:var(--radius);
  }
  .lead-card .mono{font-size:0.72rem; color:var(--amber-soft); display:block; margin-bottom:10px;}
  .lead-card h3{font-size:1.1rem; margin-bottom:4px;}
  .lead-card span.role{color:var(--ink-dimmer); font-size:0.85rem;}
  .lead-card .mission{margin-top:18px; padding-top:18px; border-top:1px solid var(--line); color:var(--ink-dim); font-size:0.9rem;}

  /* project cards */
  .card-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:18px;}
  .card-grid.triple{grid-template-columns:repeat(3, 1fr);}
  .card{
    border:1px solid var(--line); background:var(--bg-panel); padding:26px; border-radius:var(--radius);
    position:relative; transition:border-color .18s ease, transform .18s ease;
  }
  .card:hover{border-color:var(--line-strong); transform:translateY(-2px);}
  .card::before{
    content:''; position:absolute; top:-1px; left:22px; width:22px; height:2px; background:var(--amber);
  }
  .card .icon{color:var(--amber); margin-bottom:16px;}
  .card h3{font-size:1.06rem; margin-bottom:10px;}
  .card p{color:var(--ink-dim); font-size:0.9rem; margin-bottom:14px;}
  .chip-row{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{
    font-family:'IBM Plex Mono',monospace; font-size:0.68rem; color:var(--teal);
    border:1px solid rgba(136,165,214,0.35); padding:4px 9px; border-radius:20px;
  }

  /* publications */
  .pub-list{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  .pub{
    display:grid; grid-template-columns:56px 1fr; gap:20px; padding:24px 26px;
    background:var(--bg-panel);
  }
  .pub:not(:last-child){border-bottom:1px solid var(--line);}
  .pub:nth-child(even){background:var(--bg-panel-2);}
  .pub-idx{font-family:'IBM Plex Mono',monospace; color:var(--amber-soft); font-size:0.85rem; padding-top:2px;}
  .pub-title{font-size:1rem; font-weight:600; margin-bottom:8px; max-width:70ch;}
  .pub-meta{color:var(--ink-dim); font-size:0.86rem; display:flex; flex-wrap:wrap; gap-column:0; row-gap:4px;}
  .pub-meta span{margin-right:16px;}
  .pub-meta a{color:var(--teal); text-decoration:none; border-bottom:1px dotted rgba(136,165,214,0.5);}
  .pub-meta a:hover{color:var(--amber);}
  .pub-id{font-family:'IBM Plex Mono',monospace; color:var(--amber); font-size:0.8rem;}
  .pub-authors{color:var(--ink-dim); font-size:0.85rem; margin-top:10px; line-height:1.5;}
  .pub-authors .lbl{font-family:'IBM Plex Mono',monospace; font-size:0.66rem; color:var(--amber-soft); letter-spacing:0.04em; margin-right:8px; display:inline-block;}
  .pub-actions{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .cite-btn{
    font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:var(--teal); background:transparent;
    border:1px solid rgba(136,165,214,0.35); padding:7px 13px; border-radius:20px; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .cite-btn:hover{border-color:var(--amber); color:var(--amber); background:rgba(3,143,253,0.06);}
  .cite-btn.copied{border-color:#4ADE80; color:#4ADE80; background:rgba(74,222,128,0.08);}
  .cite-btn svg{flex-shrink:0;}

  /* tech table */
  .tech-table{display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  .tech-col{border-left:1px solid var(--line);}
  .tech-col:first-child{border-left:none;}
  .tech-head{
    font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:var(--amber); padding:14px 16px;
    background:var(--bg-panel-2); border-bottom:1px solid var(--line);
  }
  .tech-item{padding:11px 16px; font-size:0.88rem; color:var(--ink-dim); border-bottom:1px solid rgba(3,143,253,0.08);}
  .tech-item:last-child{border-bottom:none;}

  /* team */
  .team-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
  .team-card{border:1px solid var(--line); background:var(--bg-panel); padding:22px; border-radius:var(--radius); text-align:left;}
  .team-card .glyph{font-family:'IBM Plex Mono',monospace; font-size:1.4rem; color:var(--amber); margin-bottom:10px;}
  .team-card h4{font-size:0.95rem; margin-bottom:4px;}
  .team-card p{color:var(--ink-dimmer); font-size:0.82rem;}

  /* contact */
  .contact-panel{
    border:1px solid var(--line-strong); background:var(--bg-panel); border-radius:var(--radius);
    padding:48px; display:grid; grid-template-columns:1.1fr 1fr; gap:40px; align-items:center;
  }
  .contact-panel h2{font-size:1.8rem; max-width:16ch; margin-bottom:14px;}
  .contact-panel p{color:var(--ink-dim); max-width:40ch;}
  .contact-links{display:flex; flex-direction:column; gap:2px;}
  .contact-links a{
    display:flex; align-items:center; justify-content:space-between; text-decoration:none;
    padding:15px 4px; border-bottom:1px solid var(--line); color:var(--ink);
    font-size:0.94rem; transition:color .15s ease, padding-left .15s ease;
  }
  .contact-links a:last-child{border-bottom:none;}
  .contact-links a:hover{color:var(--amber); padding-left:8px;}
  .contact-links .arrow{color:var(--ink-dimmer); font-family:'IBM Plex Mono',monospace;}
  .contact-links a:hover .arrow{color:var(--amber);}

  footer{border-top:1px solid var(--line); padding:32px 0; }
  .foot-row{display:flex; justify-content:space-between; align-items:center; color:var(--ink-dimmer); font-size:0.8rem; font-family:'IBM Plex Mono',monospace; flex-wrap:wrap; gap:10px;}
  .foot-row a{color:var(--ink-dimmer); text-decoration:none;}
  .foot-row a:hover{color:var(--amber);}

  @media (max-width: 880px){
    nav.links{display:none;}
    .menu-btn{display:block;}
    .hero-grid{grid-template-columns:1fr;}
    .schematic{order:-1; max-width:280px;}
    .about-grid{grid-template-columns:1fr;}
    .card-grid, .card-grid.triple{grid-template-columns:1fr;}
    .tech-table{grid-template-columns:1fr 1fr;}
    .tech-col:nth-child(3){border-left:none; border-top:1px solid var(--line);}
    .tech-col:nth-child(4){border-top:1px solid var(--line);}
    .team-grid{grid-template-columns:1fr 1fr;}
    .contact-panel{grid-template-columns:1fr; padding:32px;}
    .pub{grid-template-columns:1fr; gap:8px;}
  }
</style>

<style>
  .page-hero{padding:64px 0 20px;}
  .breadcrumb{font-family:'IBM Plex Mono',monospace; font-size:0.78rem; color:var(--amber); display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .breadcrumb a{color:var(--ink-dimmer); text-decoration:none;}
  .breadcrumb a:hover{color:var(--amber);}
  .page-hero h1{font-size:clamp(2rem,3.6vw,2.8rem); line-height:1.1; max-width:20ch;}
  .page-hero p.lead{margin-top:16px; color:var(--ink-dim); font-size:1rem; max-width:56ch;}

  .member-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
  .member-card{
    border:1px solid var(--line); background:var(--bg-panel); border-radius:var(--radius);
    padding:28px; text-align:left; transition:border-color .18s ease, transform .18s ease;
  }
  .member-card:hover{border-color:var(--line-strong); transform:translateY(-2px);}
  .member-avatar{
    width:48px; height:48px; border-radius:50%; background:var(--bg-panel-2);
    border:1px solid var(--line-strong); display:flex; align-items:center; justify-content:center;
